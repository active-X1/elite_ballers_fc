<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — News | Elite Ballers FC</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-page">
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar"><div class="admin-sidebar-header"><a href="../index.html" class="admin-sidebar-logo"><span>ELITE</span> BALLERS FC</a></div></aside>
    <main class="admin-main">
      <header class="admin-topbar"><div class="admin-topbar-title"><span>ADMIN PANEL</span><h1>News</h1></div></header>
      <div class="admin-top-icons" role="navigation" aria-label="Quick admin sections">
        <a href="dashboard.html"><span class="icon">▣</span>Dashboard</a>
        <a href="players.html"><span class="icon">♟</span>Players</a>
        <a href="fixtures.html"><span class="icon">📅</span>Fixtures</a>
        <a href="results.html"><span class="icon">🏆</span>Results</a>
        <a href="gallery.html"><span class="icon">▧</span>Gallery</a>
        <a href="news.html" class="active"><span class="icon">◈</span>News</a>
        <a href="dues.html"><span class="icon">₦</span>Dues</a>
        <a href="settings.html"><span class="icon">⚙</span>Settings</a>
      </div>
      <section class="admin-content">
        <div class="admin-panel">
          <div class="admin-panel-header"><div><span class="admin-panel-label">NEWS</span><h3>Publish News</h3></div></div>
          <form id="newsForm" style="display:flex;flex-direction:column;gap:8px;">
            <input id="newsTitle" placeholder="Title" required>
            <textarea id="newsBody" placeholder="Short body" rows="4"></textarea>
            <input id="newsImage" placeholder="Image URL (optional)">
            <button class="btn btn-primary" type="submit">Publish</button>
          </form>
          <div id="newsList" style="margin-top:18px"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/admin.js"></script>
  <script type="module">
    import AdminCRUD from '/js/admin-crud.js';
    const newsList=document.getElementById('newsList');
    const newsForm=document.getElementById('newsForm');
    async function renderNews(items){ newsList.innerHTML = items.map(n=>`<article style="padding:12px;border-bottom:1px solid var(--border)"><h4>${n.title}</h4><p style="color:var(--text-muted)">${n.body}</p><div style="display:flex;gap:8px"><small>${n.created_at||''}</small><button data-id="${n.id}" data-action="delete">Delete</button></div></article>`).join(''); newsList.querySelectorAll('button[data-action]').forEach(b=>b.addEventListener('click',async()=>{ if(!confirm('Delete news?'))return; await AdminCRUD.deleteItem('news', b.dataset.id); loadNews(); })); }
    async function loadNews(){ await AdminCRUD.loadList('news', renderNews); }
    newsForm.addEventListener('submit', async e=>{ e.preventDefault(); const title=document.getElementById('newsTitle').value.trim(); const body=document.getElementById('newsBody').value.trim(); const image=document.getElementById('newsImage').value.trim(); await AdminCRUD.addItem('news', { title, body, image }); newsForm.reset(); loadNews(); });
    loadNews();
  </script>
</body>
</html>
<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>News | Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/supabase.min.js"></script>
  <script src="../js/supabase.js"></script>
</head>
<body class="admin-page">
  <div class="admin-layout"><aside class="admin-sidebar"></aside><main class="admin-main"><header class="admin-topbar"><h1>News</h1></header><section class="admin-content"><div class="admin-panel"><div class="admin-panel-header"><div><span class="admin-panel-label">NEWS</span><h3>Club News</h3></div></div><div id="newsList">Loading...</div>
    <form id="newsForm" style="margin-top:16px;"><input name="title" placeholder="Headline" required><input name="excerpt" placeholder="Short excerpt"><textarea name="body" placeholder="Full article" rows="6"></textarea><button class="btn btn-primary">Publish</button></form></div></section></main></div>
  <script src="../js/admin.js"></script>
  <script>
    (async ()=>{
      const nl=document.getElementById('newsList'); const render=(rows)=>{ nl.innerHTML=''; if(!rows.length){ nl.textContent='No news items'; return } rows.forEach(n=>{ const el=document.createElement('article'); el.className='news-card'; el.innerHTML=`<div class="news-image"><span>NEWS</span></div><div class="news-content"><span class="news-date">${new Date(n.created_at).toLocaleDateString()}</span><h3>${n.title}</h3><p>${n.excerpt||''}</p></div>`; nl.appendChild(el) }) }
      if(window.SB){ const r=await window.SB.fetchAll('news'); render(r.data||[]) }
      document.getElementById('newsForm').addEventListener('submit', async (e)=>{ e.preventDefault(); const fd=new FormData(e.target); const payload={ title: fd.get('title'), excerpt: fd.get('excerpt'), body: fd.get('body'), created_at: new Date().toISOString() }; if(window.SB){ await window.SB.insert('news', payload); const r=await window.SB.fetchAll('news'); render(r.data||[]); e.target.reset(); } })
    })();
  </script>
</body>
</html>
