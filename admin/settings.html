<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d4ff00">
<title>Settings | Elite Ballers FC Admin</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin-ui.css">
<script src="../js/theme.js"></script>
</head>
<body data-page="settings.html" data-title="Settings" class="eb-admin-page">
<div data-admin-page>
<section class="page-head">
  <div><span class="eyebrow">CLUB CONTROL</span><h2>Settings</h2><p>Manage public club details, weekly dues and your admin account.</p></div>
</section>
<div class="split">
<section class="card">
  <div class="card-head"><div><small>PUBLIC PROFILE</small><h3>Club information</h3></div></div>
  <div class="card-body">
    <form id="clubSettingsForm" class="form-grid">
      <div class="field full"><label for="clubName">Club name</label><input id="clubName" maxlength="100" required></div>
      <div class="field"><label for="duesAmount">Weekly dues (₦)</label><input id="duesAmount" type="number" min="0" max="1000000" inputmode="numeric" required></div>
      <div class="field"><label for="contactEmail">Contact email</label><input id="contactEmail" type="email" placeholder="Optional"></div>
      <div class="field"><label for="whatsappNumber">WhatsApp number</label><input id="whatsappNumber" inputmode="tel" placeholder="2348012345678"><span class="helper">Use country code, digits only.</span></div>
      <div class="field"><label for="trainingLocation">Training location</label><input id="trainingLocation" maxlength="160" placeholder="Optional"></div>
      <div class="field"><label for="coachName">Head coach</label><input id="coachName" maxlength="100" placeholder="Optional"></div>
      <div class="field full"><label for="coachBio">Coach profile</label><textarea id="coachBio" rows="5" maxlength="800" placeholder="Short public coach profile"></textarea></div>
      <div class="form-actions full"><button class="btn primary" id="saveClubSettings" type="submit">Save club settings</button></div>
    </form>
  </div>
</section>
<section class="card">
  <div class="card-head"><div><small>ACCOUNT</small><h3>Admin security</h3></div></div>
  <div class="card-body">
    <p class="helper">Signed in as <strong id="accountEmail">Loading…</strong></p>
    <form id="passwordForm" class="form-grid" style="margin-top:12px">
      <div class="field full"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters"></div>
      <div class="field full"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Repeat new password"></div>
      <div class="form-actions full"><button class="btn primary" id="savePassword" type="submit">Update password</button></div>
    </form>
    <button class="btn" id="logoutSettings" style="margin-top:12px">⇥ Log out</button>
  </div>
</section>
</div>
</div>
<div class="toast" id="toast" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/admin-guard.js"></script>
<script src="../js/admin-ui.js"></script>
<script>
(async()=>{
  const $=id=>document.getElementById(id);
  const toast=(m,e=false)=>{const t=$('toast');t.textContent=m;t.classList.toggle('error',e);t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)};
  const defaults={club_name:'Elite Ballers FC',dues_amount:'100',contact_email:'',whatsapp_number:'',training_location:'',coach_name:'',coach_bio:''};
  async function load(){
    if(!SB){toast('Supabase is not configured.',true);return}
    const [settings,user]=await Promise.all([SB.fetchAll('club_settings'),SB.getUser()]);
    if(settings.error){toast(settings.error.message,true);return}
    const values={...defaults,...Object.fromEntries((settings.data||[]).map(x=>[x.key,x.value??'']))};
    $('clubName').value=values.club_name;$('duesAmount').value=Number(values.dues_amount)||100;$('contactEmail').value=values.contact_email;$('whatsappNumber').value=values.whatsapp_number;$('trainingLocation').value=values.training_location;$('coachName').value=values.coach_name;$('coachBio').value=values.coach_bio;
    $('accountEmail').textContent=user?.email||'Admin';
  }
  $('clubSettingsForm').onsubmit=async e=>{
    e.preventDefault();
    if(!SB)return toast('Supabase is not configured.',true);
    const values={club_name:$('clubName').value.trim(),dues_amount:String(Math.max(0,Number($('duesAmount').value)||0)),contact_email:$('contactEmail').value.trim(),whatsapp_number:$('whatsappNumber').value.replace(/\D/g,''),training_location:$('trainingLocation').value.trim(),coach_name:$('coachName').value.trim(),coach_bio:$('coachBio').value.trim()};
    $('saveClubSettings').disabled=true;
    try{
      const results=await Promise.all(Object.entries(values).map(([key,value])=>SB.upsert('club_settings',{key,value},'key')));
      const failed=results.find(r=>r.error);
      if(failed)throw failed.error;
      toast('Club settings saved ✓');
    }catch(err){toast(err.message||'Could not save settings.',true)}
    finally{$('saveClubSettings').disabled=false}
  };
  $('passwordForm').onsubmit=async e=>{
    e.preventDefault();const a=$('newPassword').value,b=$('confirmPassword').value;
    if(a!==b)return toast('Passwords do not match.',true);if(a.length<8)return toast('Use at least 8 characters.',true);
    if(!SB)return toast('Supabase is not configured.',true);
    $('savePassword').disabled=true;try{const r=await SB.updatePassword(a);if(r.error)throw r.error;$('passwordForm').reset();toast('Password updated ✓')}catch(err){toast(err.message||'Could not update password.',true)}finally{$('savePassword').disabled=false}
  };
  $('logoutSettings').onclick=async()=>{await SB?.signOut();location.href='login.html'};
  load();
})();
</script>
</body></html>
