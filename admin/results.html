<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — Results | Elite Ballers FC</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-page">
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar"><div class="admin-sidebar-header"><a href="../index.html" class="admin-sidebar-logo"><span>ELITE</span> BALLERS FC</a></div></aside>
    <main class="admin-main">
      <header class="admin-topbar"><div class="admin-topbar-title"><span>ADMIN PANEL</span><h1>Results</h1></div></header>
      <div class="admin-top-icons" role="navigation" aria-label="Quick admin sections">
        <a href="dashboard.html"><span class="icon">▣</span>Dashboard</a>
        <a href="players.html"><span class="icon">♟</span>Players</a>
        <a href="fixtures.html"><span class="icon">📅</span>Fixtures</a>
        <a href="results.html" class="active"><span class="icon">🏆</span>Results</a>
        <a href="gallery.html"><span class="icon">▧</span>Gallery</a>
        <a href="news.html"><span class="icon">◈</span>News</a>
        <a href="dues.html"><span class="icon">₦</span>Dues</a>
        <a href="settings.html"><span class="icon">⚙</span>Settings</a>
      </div>
      <section class="admin-content">
        <div class="admin-panel">
          <div class="admin-panel-header"><div><span class="admin-panel-label">RESULTS</span><h3>Record Results</h3></div></div>
          <form id="resultForm" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <input id="resultDate" placeholder="Date" required>
            <input id="resultOpponent" placeholder="Opponent" required>
            <input id="resultFor" placeholder="Our Goals" required>
            <input id="resultAgainst" placeholder="Their Goals" required>
            <button class="btn btn-primary" type="submit">Save Result</button>
          </form>
          <div id="resultsList" style="margin-top:18px"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/admin.js"></script>
  <script type="module">
    import AdminCRUD from '/js/admin-crud.js';
    const resultsList=document.getElementById('resultsList');
    const resultForm=document.getElementById('resultForm');
    async function renderResults(items){ resultsList.innerHTML=items.map(r=>`<div style="padding:10px;border-bottom:1px solid var(--border)"><strong>${r.date}</strong> — ${r.opponent} <span style="color:var(--text-muted)">${r.for_goals}–${r.against_goals}</span> <button data-id="${r.id}" data-action="delete">Delete</button></div>`).join(''); resultsList.querySelectorAll('button[data-action]').forEach(b=>b.addEventListener('click',async()=>{ if(!confirm('Delete result?'))return; await AdminCRUD.deleteItem('results', b.dataset.id); loadResults(); })); }
    async function loadResults(){ await AdminCRUD.loadList('results', renderResults); }
    resultForm.addEventListener('submit', async e=>{ e.preventDefault(); const date=document.getElementById('resultDate').value.trim(); const opponent=document.getElementById('resultOpponent').value.trim(); const for_goals=document.getElementById('resultFor').value.trim(); const against_goals=document.getElementById('resultAgainst').value.trim(); await AdminCRUD.addItem('results', { date, opponent, for_goals, against_goals }); resultForm.reset(); loadResults(); });
    loadResults();
  </script>
</body>
</html>
<!doctype html>
<html>
<head>
  <meta charset utf-8><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Results | Admin</title>
  <link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/supabase.min.js"></script>
  <script src="../js/supabase.js"></script>
</head>
<body class="admin-page"><div class="admin-layout"><aside class="admin-sidebar"></aside><main class="admin-main"><header class="admin-topbar"><h1>Results</h1></header><section class="admin-content"><div class="admin-panel"><div class="admin-panel-header"><div><span class="admin-panel-label">RESULTS</span><h3>Match Results</h3></div></div>
  <div id="resultsList">Loading...</div>
  <form id="resultForm" style="margin-top:14px;">
    <input name="home" placeholder="Home team" required>
    <input name="home_score" placeholder="Home score" required>
    <input name="away" placeholder="Away team" required>
    <input name="away_score" placeholder="Away score" required>
    <button class="btn btn-primary">Add Result</button>
  </form>
  </div></section></main></div>
  <script src="../js/admin.js"></script>
  <script>
    (async ()=>{
      const rl=document.getElementById('resultsList'); const render=(rows)=>{ rl.innerHTML=''; if(!rows.length){rl.textContent='No results'; return} rows.forEach(r=>{ const el=document.createElement('div'); el.className='news-card'; el.innerHTML=`<div class="news-content"><h3>${r.home} ${r.home_score} - ${r.away_score} ${r.away}</h3><p>${new Date(r.created_at||r.date||Date.now()).toLocaleDateString()}</p></div>`; rl.appendChild(el) }) }
      if(window.SB){ const r=await window.SB.fetchAll('results'); render(r.data||[]) }
      document.getElementById('resultForm').addEventListener('submit', async e=>{ e.preventDefault(); const fd=new FormData(e.target); const payload={ home:fd.get('home'), home_score:fd.get('home_score'), away:fd.get('away'), away_score:fd.get('away_score'), created_at:new Date().toISOString() }; if(window.SB){ await window.SB.insert('results', payload); const r=await window.SB.fetchAll('results'); render(r.data||[]); e.target.reset(); } })
    })();
  </script>
</body>
</html>
