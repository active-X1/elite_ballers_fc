<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Results | Elite Ballers FC Admin</title>
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin-ui.css">
<script src="../js/theme.js"></script>
</head>
<body data-page="results.html" data-title="Results" class="eb-admin-page">
<div data-admin-page>
<section class="page-head"><div><span class="eyebrow">MATCH CENTRE</span><h2>Results</h2><p>Record results once and keep the public scoreline consistent.</p></div><div class="page-actions"><button class="btn" id="refreshResults">↻ Refresh</button><button class="btn primary" id="addResult">＋ Add Result</button></div></section>
<section class="card"><div class="toolbar"><input class="grow" id="resultSearch" placeholder="Search opponent or venue…"></div><div class="list-stack" id="resultsList"><div class="empty">Loading…</div></div></section>
<div class="modal" id="resultModal"><div class="modal-card"><div class="modal-head"><div><span class="eyebrow">RESULT</span><h3 id="resultModalTitle">Add Result</h3></div><button class="modal-close" type="button" data-close>×</button></div><form id="resultForm" class="form-grid"><input type="hidden" id="resultId"><div class="field full"><label for="resultOpponent">Opponent</label><input id="resultOpponent" required maxlength="80" placeholder="Opponent name"></div><div class="field"><label for="ourGoals">Elite Ballers goals</label><input id="ourGoals" type="number" min="0" max="99" required inputmode="numeric" value="0"></div><div class="field"><label for="oppGoals">Opponent goals</label><input id="oppGoals" type="number" min="0" max="99" required inputmode="numeric" value="0"></div><div class="field"><label for="resultDate">Date</label><input id="resultDate" type="date" required></div><div class="field"><label for="resultVenue">Venue</label><input id="resultVenue" maxlength="120" placeholder="Venue / pitch"></div><div class="field full"><label for="resultNotes">Notes</label><textarea id="resultNotes" rows="3" maxlength="400" placeholder="Optional notes"></textarea></div><div class="form-actions full"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" id="saveResult" type="submit">Save result</button></div></form></div></div>
</div>
<div class="toast" id="toast" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script><script src="../js/supabase.js"></script><script src="../js/admin-guard.js"></script><script src="../js/admin-ui.js"></script>
<script>
(async()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let rows=[];const toast=(m,e=false)=>{const t=$('toast');t.textContent=m;t.classList.toggle('error',e);t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};function render(){const q=$('resultSearch').value.toLowerCase();const list=rows.filter(r=>`${r.opponent} ${r.venue||''}`.toLowerCase().includes(q));$('resultsList').innerHTML=list.map(r=>{const cls=r.our_goals>r.opponent_goals?'W':r.our_goals===r.opponent_goals?'D':'L';return `<article class="list-row"><div><h4>Elite Ballers FC ${r.our_goals} – ${r.opponent_goals} ${esc(r.opponent)}</h4><p>${new Date(r.played_on).toLocaleDateString([], {dateStyle:'medium'})} · ${esc(r.venue||'Venue TBA')}</p></div><div class="row-actions"><span class="badge">${cls}</span><button class="mini-btn" data-edit="${r.id}">✎</button><button class="mini-btn danger" data-delete="${r.id}">🗑</button></div></article>`}).join('')||'<div class="empty">No results found.</div>'}async function load(){if(!SB){$('resultsList').innerHTML='<div class="empty">Supabase is not configured.</div>';return}const r=await SB.fetchAll('results',{orderBy:'played_on',ascending:false});if(r.error)return toast(r.error.message,true);rows=r.data||[];render()}function close(){$('resultModal').classList.remove('open')}function open(r){$('resultForm').reset();$('resultId').value=r?.id||'';$('resultModalTitle').textContent=r?'Edit Result':'Add Result';$('resultOpponent').value=r?.opponent||'';$('ourGoals').value=r?.our_goals??0;$('oppGoals').value=r?.opponent_goals??0;$('resultDate').value=r?.played_on?new Date(r.played_on).toISOString().slice(0,10):new Date().toISOString().slice(0,10);$('resultVenue').value=r?.venue||'';$('resultNotes').value=r?.notes||'';$('resultModal').classList.add('open')}$('addResult').onclick=()=>open();$('refreshResults').onclick=load;$('resultSearch').oninput=render;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);$('resultModal').onclick=e=>{if(e.target.id==='resultModal')close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});document.addEventListener('click',async e=>{const ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(ed)open(rows.find(x=>x.id===ed.dataset.edit));if(del){if(!confirm('Delete this result?'))return;const r=await SB.remove('results',del.dataset.delete);if(r.error)toast(r.error.message,true);else{toast('Result deleted');load()}}});$('resultForm').onsubmit=async e=>{e.preventDefault();const id=$('resultId').value,row={opponent:$('resultOpponent').value.trim(),our_goals:Number($('ourGoals').value),opponent_goals:Number($('oppGoals').value),played_on:new Date(`${$('resultDate').value}T12:00:00`).toISOString(),venue:$('resultVenue').value.trim()||null,notes:$('resultNotes').value.trim()||null};$('saveResult').disabled=true;const r=id?await SB.update('results',id,row):await SB.insert('results',row);$('saveResult').disabled=false;if(r.error)toast(r.error.message,true);else{close();toast(id?'Result updated ✓':'Result saved ✓');load()}};load()})();
</script>
</body></html>
