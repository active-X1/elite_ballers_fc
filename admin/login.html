<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Admin Login | Elite Ballers FC</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin-ui.css"><style>
.eb-login-page{min-height:100svh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 10% 0,rgba(212,255,0,.13),transparent 35%),var(--adm-bg)}.eb-login-wrap{width:min(440px,100%)}.eb-login-card{background:var(--adm-surface);border:1px solid var(--adm-line);border-radius:26px;padding:clamp(20px,5vw,32px);box-shadow:var(--adm-shadow)}.eb-login-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;font-weight:900}.eb-login-badge{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;overflow:hidden;background:#d4ff00;color:#111;font-size:1.2rem}.eb-login-badge img{width:100%;height:100%;object-fit:cover}.eb-login-kicker{font-size:.64rem;letter-spacing:.16em;color:var(--adm-muted);font-weight:900}.eb-login-card h1{font-size:clamp(1.55rem,7vw,2.2rem);margin:4px 0 7px}.eb-login-card p{color:var(--adm-muted);margin:0 0 20px}.eb-login-form{display:grid;gap:12px}.eb-login-field{display:grid;gap:6px}.eb-login-field label{font-size:.75rem;font-weight:850}.eb-login-field input{background:var(--adm-soft)}.eb-login-password{position:relative}.eb-login-password input{padding-right:52px}.eb-login-password button{position:absolute;right:6px;top:6px;height:38px;width:40px;border:0;border-radius:10px;background:transparent;color:var(--adm-muted);cursor:pointer}.eb-login-btn{min-height:50px;border:0;border-radius:14px;background:#d4ff00;color:#111;font-weight:950;cursor:pointer;margin-top:3px}.eb-login-message{min-height:20px;font-size:.78rem}.eb-login-message.error{color:#ff7777}.eb-login-message.success{color:#43d17a}.eb-login-foot{display:flex;justify-content:space-between;gap:10px;margin-top:16px;font-size:.74rem}.eb-login-foot a{color:var(--adm-muted)}.eb-login-theme{position:fixed;top:14px;right:14px}.eb-login-theme button{width:42px;height:42px;border:1px solid var(--adm-line);border-radius:12px;background:var(--adm-surface);color:inherit;cursor:pointer}
</style><script src="../js/theme.js"></script></head><body data-admin-public="true" class="eb-admin-page eb-login-page"><div class="eb-login-theme"><button id="themeToggle" data-theme-toggle aria-label="Switch theme">☾</button></div><main class="eb-login-wrap"><section class="eb-login-card"><a class="eb-login-brand" href="../index.html"><span class="eb-login-badge"><img src="../assets/images/logo.png" alt="" width="44" height="44"></span><span><strong>ELITE BALLERS</strong><small style="display:block;color:var(--adm-muted);font-size:.63rem;letter-spacing:.16em">FC ADMIN</small></span></a><span class="eb-login-kicker">SECURE ADMINISTRATION</span><h1>Welcome back.</h1><p>Manage players, fixtures, results, news, gallery and team dues.</p><form class="eb-login-form" id="loginForm"><div class="eb-login-field"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" required placeholder="you@example.com"></div><div class="eb-login-field"><label for="password">Password</label><div class="eb-login-password"><input id="password" type="password" autocomplete="current-password" required placeholder="Your password"><button type="button" id="showPass" aria-label="Show password">👁</button></div></div><div class="eb-login-message" id="loginMessage" aria-live="polite"></div><button type="button" class="eb-login-forgot" id="forgotPassword">Forgot password?</button><button class="eb-login-btn" id="loginBtn" type="submit">Sign in to dashboard →</button></form><div class="eb-login-foot"><a href="../index.html">← Back to website</a><span>Authorized admins only</span></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script><script>
(async()=>{const $=id=>document.getElementById(id),msg=$('loginMessage'),btn=$('loginBtn');const setMsg=(text,type='')=>{msg.className=`eb-login-message ${type}`;msg.textContent=text};$('themeToggle').onclick=()=>{const c=EBTheme.stored();EBTheme.apply(c==='system'?'dark':c==='dark'?'light':'system')};$('showPass').onclick=()=>{const p=$('password');p.type=p.type==='password'?'text':'password';$('showPass').setAttribute('aria-label',p.type==='password'?'Show password':'Hide password')};$('forgotPassword').onclick=async()=>{const email=$('email').value.trim();if(!email){setMsg('Enter your admin email first.','error');$('email').focus();return}if(!SB){setMsg('Supabase is not configured.','error');return}$('forgotPassword').disabled=true;try{const r=await SB.resetPassword(email);if(r.error)throw r.error;setMsg('Password reset email sent. Check your inbox.','success')}catch(err){setMsg(err.message||'Could not send the reset email.','error')}finally{$('forgotPassword').disabled=false}};$('loginForm').onsubmit=async e=>{e.preventDefault();setMsg('Signing in…');btn.disabled=true;if(!SB){setMsg('Supabase is not configured. Set your deployment environment variables or js/config.js.','error');btn.disabled=false;return}try{const r=await SB.signIn($('email').value.trim(),$('password').value);if(r.error)throw r.error;const ok=await SB.isAdmin();if(!ok){await SB.signOut();throw Error('This account is not authorized as an administrator.')}setMsg('Login successful. Opening dashboard…','success');const param=new URLSearchParams(location.search).get('next');let target='admin/dashboard.html';if(param){try{const url=new URL(param,location.origin);if(url.origin===location.origin && url.pathname.startsWith('/admin/')) target=url.pathname+url.search+url.hash}catch{}}setTimeout(()=>location.href=target,250)}catch(err){setMsg(err.message||'Sign-in failed.','error')}finally{btn.disabled=false}};if(SB){const ok=await SB.isAdmin();if(ok)location.href='dashboard.html'}})();
</script></body></html>
