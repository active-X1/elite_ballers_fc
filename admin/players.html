<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Players | Elite Ballers FC Admin</title>
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin-ui.css">
<script src="../js/theme.js"></script>
</head>
<body data-page="players.html" data-title="Players" class="eb-admin-page">
<div data-admin-page>
<section class="page-head"><div><span class="eyebrow">SQUAD</span><h2>Players</h2><p>Build a clean, current official roster.</p></div><div class="page-actions"><button class="btn" id="refreshPlayers">↻ Refresh</button><button class="btn primary" id="addPlayer">＋ Add Player</button></div></section>
<section class="card"><div class="toolbar"><input class="grow" id="playerSearch" placeholder="Search name, position or jersey number…"><select id="playerStatus" style="max-width:170px"><option value="active">Active players</option><option value="inactive">Inactive</option><option value="all">All players</option></select></div><div class="player-grid" id="playersList"><div class="empty">Loading…</div></div></section>
<div class="modal" id="playerModal"><div class="modal-card"><div class="modal-head"><div><span class="eyebrow">PLAYER PROFILE</span><h3 id="playerModalTitle">Add Player</h3></div><button class="modal-close" type="button" data-close>×</button></div><form id="playerForm" class="form-grid"><input type="hidden" id="playerId"><div class="field full"><label for="playerName">Full name</label><input id="playerName" required maxlength="80" placeholder="e.g. Cyrus Akacha Cyprian"></div><div class="field"><label for="playerNumber">Jersey number</label><input id="playerNumber" type="number" min="0" max="99" inputmode="numeric" placeholder="10"></div><div class="field"><label for="playerPosition">Position</label><input id="playerPosition" maxlength="30" placeholder="RWF"></div><div class="field"><label for="playerStatusValue">Status</label><select id="playerStatusValue"><option value="active">Active</option><option value="inactive">Inactive</option></select></div><div class="field"><label for="playerImage">Photo URL</label><input id="playerImage" type="url" placeholder="https://…"><span class="helper">A square image works best on phones.</span></div><div class="field full"><label for="playerBio">Short bio</label><textarea id="playerBio" rows="4" maxlength="500" placeholder="Optional player bio"></textarea></div><div class="form-actions full"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" id="savePlayer" type="submit">Save player</button></div></form></div></div>
</div>
<div class="toast" id="toast" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script><script src="../js/supabase.js"></script><script src="../js/admin-guard.js"></script><script src="../js/admin-ui.js"></script>
<script>
(async()=>{
 const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); let rows=[];
 const toast=(m,err=false)=>{const t=$('toast');t.textContent=m;t.classList.toggle('error',err);t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};
 const avatar=p=>p.image_url?`<img class="player-avatar" src="${esc(p.image_url)}" alt="" loading="lazy" onerror="this.onerror=null;this.src='../assets/app-icon.svg'">`:`<div class="player-avatar" style="display:grid;place-items:center;font-size:1.45rem">⚽</div>`;
 function render(){const q=$('playerSearch').value.trim().toLowerCase(), status=$('playerStatus').value;const filtered=rows.filter(p=>(status==='all'||p.status===status)&&(`${p.name||''} ${p.position||''} ${p.number??''}`.toLowerCase().includes(q)));$('playersList').innerHTML=filtered.map(p=>`<article class="player-card-admin">${avatar(p)}<div class="player-copy"><strong>${esc(p.name)}</strong><small>#${p.number??'—'} · ${esc(p.position||'Player')} · ${p.status==='active'?'Active':'Inactive'}</small></div><div class="row-actions"><button class="mini-btn" data-edit="${p.id}" aria-label="Edit ${esc(p.name)}">✎</button><button class="mini-btn danger" data-archive="${p.id}" aria-label="${p.status==='active'?'Archive':'Restore'} ${esc(p.name)}">${p.status==='active'?'⌄':'↥'}</button></div></article>`).join('')||'<div class="empty">No players match your search.</div>';}
 async function load(){if(!SB){$('playersList').innerHTML='<div class="empty">Supabase is not configured.</div>';return}const r=await SB.fetchAll('players',{orderBy:'number'});if(r.error){toast(r.error.message,true);return}rows=r.data||[];render()}
 function close(){ $('playerModal').classList.remove('open'); }
 function open(p){$('playerForm').reset();$('playerId').value=p?.id||'';$('playerModalTitle').textContent=p?'Edit Player':'Add Player';$('playerName').value=p?.name||'';$('playerNumber').value=p?.number??'';$('playerPosition').value=p?.position||'';$('playerStatusValue').value=p?.status||'active';$('playerImage').value=p?.image_url||'';$('playerBio').value=p?.bio||'';$('playerModal').classList.add('open');setTimeout(()=>$('playerName').focus(),50)}
 document.addEventListener('click',async e=>{const edit=e.target.closest('[data-edit]'), archive=e.target.closest('[data-archive]');if(edit){open(rows.find(p=>p.id===edit.dataset.edit))}if(archive){const p=rows.find(x=>x.id===archive.dataset.archive);if(!p)return;const active=p.status==='active';if(!confirm(`${active?'Archive':'Restore'} ${p.name}?`))return;const r=await SB.update('players',p.id,{status:active?'inactive':'active'});if(r.error)toast(r.error.message,true);else{toast(active?'Player archived':'Player restored');load()}}});
 $('addPlayer').onclick=()=>open();$('refreshPlayers').onclick=load;$('playerSearch').oninput=render;$('playerStatus').onchange=render;$('playerModal').onclick=e=>{if(e.target.id==='playerModal')close()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
 $('playerForm').onsubmit=async e=>{e.preventDefault();const id=$('playerId').value;const row={name:$('playerName').value.trim(),number:$('playerNumber').value?Number($('playerNumber').value):null,position:$('playerPosition').value.trim()||null,status:$('playerStatusValue').value,image_url:$('playerImage').value.trim()||null,bio:$('playerBio').value.trim()||null};if(row.number!=null&&row.status==='active'){const clash=rows.find(p=>p.id!==id&&p.status==='active'&&p.number===row.number);if(clash&&!confirm(`#${row.number} is already worn by ${clash.name}. Save anyway?`))return}$('savePlayer').disabled=true;const r=id?await SB.update('players',id,row):await SB.insert('players',row);$('savePlayer').disabled=false;if(r.error)toast(r.error.message,true);else{close();toast(id?'Player updated ✓':'Player added ✓');load()}};load();
})();
</script>
</body></html>
