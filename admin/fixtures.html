<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fixtures | Elite Ballers FC Admin</title>
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin-ui.css">
<script src="../js/theme.js"></script>
</head>
<body data-page="fixtures.html" data-title="Fixtures" class="eb-admin-page">
<div data-admin-page>
<section class="page-head"><div><span class="eyebrow">MATCH CENTRE</span><h2>Fixtures</h2><p>Keep upcoming matches accurate and easy to read.</p></div><div class="page-actions"><button class="btn" id="refreshFixtures">↻ Refresh</button><button class="btn primary" id="addFixture">＋ Add Fixture</button></div></section>
<section class="card"><div class="toolbar"><input class="grow" id="fixtureSearch" placeholder="Search opponent or venue…"><select id="fixtureStatus" style="max-width:180px"><option value="upcoming" selected>Upcoming</option><option value="all">All statuses</option><option value="postponed">Postponed</option><option value="cancelled">Cancelled</option><option value="completed">Completed</option></select></div><div class="list-stack" id="fixturesList"><div class="empty">Loading…</div></div></section>
<div class="modal" id="fixtureModal"><div class="modal-card"><div class="modal-head"><div><span class="eyebrow">MATCH DETAILS</span><h3 id="fixtureModalTitle">Add Fixture</h3></div><button class="modal-close" type="button" data-close>×</button></div><form id="fixtureForm" class="form-grid"><input type="hidden" id="fixtureId"><div class="field full"><label for="fixtureTitle">Match title</label><input id="fixtureTitle" maxlength="100" placeholder="League match / Friendly / Training game"></div><div class="field full"><label for="fixtureOpponent">Opponent</label><input id="fixtureOpponent" required maxlength="80" placeholder="Opponent name"></div><div class="field"><label for="fixtureDate">Date</label><input id="fixtureDate" type="date" required></div><div class="field"><label for="fixtureTime">Time</label><input id="fixtureTime" type="time"></div><div class="field"><label for="fixtureVenue">Venue</label><input id="fixtureVenue" maxlength="120" placeholder="Venue / pitch"></div><div class="field"><label for="fixtureStatusValue">Status</label><select id="fixtureStatusValue"><option value="upcoming">Upcoming</option><option value="postponed">Postponed</option><option value="cancelled">Cancelled</option><option value="completed">Completed</option></select></div><div class="field full"><label for="fixtureNotes">Notes</label><textarea id="fixtureNotes" rows="3" maxlength="400" placeholder="Optional match notes"></textarea></div><div class="form-actions full"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" id="saveFixture" type="submit">Save fixture</button></div></form></div></div>
</div>
<div class="toast" id="toast" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script><script src="../js/supabase.js"></script><script src="../js/admin-guard.js"></script><script src="../js/admin-ui.js"></script>
<script>
(async()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let rows=[];const toast=(m,e=false)=>{const t=$('toast');t.textContent=m;t.classList.toggle('error',e);t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};function render(){const q=$('fixtureSearch').value.toLowerCase(),s=$('fixtureStatus').value;const list=rows.filter(f=>(s==='all'||f.status===s)&&(`${f.opponent} ${f.venue||''} ${f.title||''}`.toLowerCase().includes(q))).sort((a,b)=>new Date(a.match_date)-new Date(b.match_date));$('fixturesList').innerHTML=list.map(f=>`<article class="list-row"><div><h4>${esc(f.title||`Elite Ballers FC vs ${f.opponent}`)}</h4><p>${new Date(f.match_date).toLocaleString([], {dateStyle:'medium',timeStyle:'short'})} · ${esc(f.venue||'Venue TBA')}</p></div><div class="row-actions"><span class="badge ${f.status!=='upcoming'?'muted':''}">${esc(f.status)}</span><button class="mini-btn" data-edit="${f.id}">✎</button><button class="mini-btn danger" data-delete="${f.id}">🗑</button></div></article>`).join('')||'<div class="empty">No fixtures found.</div>'}async function load(){if(!SB){$('fixturesList').innerHTML='<div class="empty">Supabase is not configured.</div>';return}const r=await SB.fetchAll('fixtures',{orderBy:'match_date'});if(r.error)return toast(r.error.message,true);rows=r.data||[];render()}function close(){$('fixtureModal').classList.remove('open')}function open(f){$('fixtureForm').reset();$('fixtureId').value=f?.id||'';$('fixtureModalTitle').textContent=f?'Edit Fixture':'Add Fixture';$('fixtureTitle').value=f?.title||'';$('fixtureOpponent').value=f?.opponent||'';if(f?.match_date){const d=new Date(f.match_date);$('fixtureDate').value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;$('fixtureTime').value=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}$('fixtureVenue').value=f?.venue||'';$('fixtureStatusValue').value=f?.status||'upcoming';$('fixtureNotes').value=f?.notes||'';$('fixtureModal').classList.add('open')}$('addFixture').onclick=()=>open();$('refreshFixtures').onclick=load;$('fixtureSearch').oninput=render;$('fixtureStatus').onchange=render;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);$('fixtureModal').onclick=e=>{if(e.target.id==='fixtureModal')close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});document.addEventListener('click',async e=>{const ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(ed)open(rows.find(x=>x.id===ed.dataset.edit));if(del){const f=rows.find(x=>x.id===del.dataset.delete);if(f&&!confirm(`Delete fixture against ${f.opponent}?`))return;const r=await SB.remove('fixtures',del.dataset.delete);if(r.error)toast(r.error.message,true);else{toast('Fixture deleted');load()}}});$('fixtureForm').onsubmit=async e=>{e.preventDefault();const id=$('fixtureId').value,date=$('fixtureDate').value,time=$('fixtureTime').value||'12:00';const row={title:$('fixtureTitle').value.trim()||null,opponent:$('fixtureOpponent').value.trim(),venue:$('fixtureVenue').value.trim()||null,status:$('fixtureStatusValue').value,notes:$('fixtureNotes').value.trim()||null,match_date:new Date(`${date}T${time}:00`).toISOString()};$('saveFixture').disabled=true;const r=id?await SB.update('fixtures',id,row):await SB.insert('fixtures',row);$('saveFixture').disabled=false;if(r.error)toast(r.error.message,true);else{close();toast(id?'Fixture updated ✓':'Fixture added ✓');load()}};load()})();
</script>
</body></html>
